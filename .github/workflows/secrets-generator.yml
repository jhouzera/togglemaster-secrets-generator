name: Secrets Generator

on:
  issues:
    types: [opened]

permissions:
  id-token: write
  contents: read
  issues: write

jobs:
  parse_issue:
    # a label so pode ser aplicada pelo template se ja existir no repo, entao o titulo eh usado como gatilho confiavel
    if: startsWith(github.event.issue.title, '[secrets-generator]')
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.issue_parser.outputs.issueparser_env }}
      secret_name: ${{ steps.issue_parser.outputs.issueparser_secret_name }}
    steps:
      - name: Comment workflow run link
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `Para acompanhar a criação do segredo, acesse o link da execução do workflow: ${runUrl}`,
            });

      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse issue form
        id: issue_parser
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/secret-request.yml

      - name: Mask secret value
        run: echo "::add-mask::${{ steps.issue_parser.outputs.issueparser_secret_value }}"

      - name: Validate secret name
        env:
          ENV: ${{ steps.issue_parser.outputs.issueparser_env }}
          SECRET_NAME: ${{ steps.issue_parser.outputs.issueparser_secret_name }}
        run: |
          EXPECTED_PREFIX="togglemaster-${ENV}/"
          SECRET_NAME_IS_VALID=$(echo "$SECRET_NAME" | grep -w -P "^([a-z]|-|\d)+\/([a-z]|-|\d)+\/([a-z]|-|\d)+$")
          if [ -z "$SECRET_NAME_IS_VALID" ]; then
            echo "The secret name is not valid."
            echo "The Secret name should look like: ${EXPECTED_PREFIX}app/secret-name"
            exit 111
          fi
          if [[ "$SECRET_NAME" != "${EXPECTED_PREFIX}"* ]]; then
            echo "The secret name must start with '${EXPECTED_PREFIX}' for the '${ENV}' environment."
            echo "A role IAM so tem permissao para criar/atualizar secrets sob esse prefixo."
            exit 111
          fi

          echo "All inputs are valid. Proceeding."

  # jobs separados por ambiente com "environment:" literal: o claim ":environment:<nome>" do token OIDC
  # so e' incluido quando o nome do environment e' estatico no job, nao quando vem de needs.*.outputs.
  create_secret_dev:
    needs: parse_issue
    if: needs.parse_issue.outputs.env == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse issue form
        id: issue_parser
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/secret-request.yml

      - name: Mask secret value
        run: echo "::add-mask::${{ steps.issue_parser.outputs.issueparser_secret_value }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create or update secret
        env:
          SECRET_NAME: ${{ needs.parse_issue.outputs.secret_name }}
          SECRET_VALUE: ${{ steps.issue_parser.outputs.issueparser_secret_value }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          SECRET_EXISTS=$(aws secretsmanager describe-secret --region "${REGION}" --secret-id "${SECRET_NAME}" 2> /dev/null | jq .Name || true)
          if [ -z "$SECRET_EXISTS" ]; then
            aws secretsmanager create-secret --region "${REGION}" --name "${SECRET_NAME}" --secret-string "${SECRET_VALUE}"
          else
            aws secretsmanager update-secret --region "${REGION}" --secret-id "${SECRET_NAME}" --secret-string "${SECRET_VALUE}"
          fi

  create_secret_qa:
    needs: parse_issue
    if: needs.parse_issue.outputs.env == 'qa'
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse issue form
        id: issue_parser
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/secret-request.yml

      - name: Mask secret value
        run: echo "::add-mask::${{ steps.issue_parser.outputs.issueparser_secret_value }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create or update secret
        env:
          SECRET_NAME: ${{ needs.parse_issue.outputs.secret_name }}
          SECRET_VALUE: ${{ steps.issue_parser.outputs.issueparser_secret_value }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          SECRET_EXISTS=$(aws secretsmanager describe-secret --region "${REGION}" --secret-id "${SECRET_NAME}" 2> /dev/null | jq .Name || true)
          if [ -z "$SECRET_EXISTS" ]; then
            aws secretsmanager create-secret --region "${REGION}" --name "${SECRET_NAME}" --secret-string "${SECRET_VALUE}"
          else
            aws secretsmanager update-secret --region "${REGION}" --secret-id "${SECRET_NAME}" --secret-string "${SECRET_VALUE}"
          fi

  create_secret_prod:
    needs: parse_issue
    if: needs.parse_issue.outputs.env == 'prod'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse issue form
        id: issue_parser
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/secret-request.yml

      - name: Mask secret value
        run: echo "::add-mask::${{ steps.issue_parser.outputs.issueparser_secret_value }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create or update secret
        env:
          SECRET_NAME: ${{ needs.parse_issue.outputs.secret_name }}
          SECRET_VALUE: ${{ steps.issue_parser.outputs.issueparser_secret_value }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          SECRET_EXISTS=$(aws secretsmanager describe-secret --region "${REGION}" --secret-id "${SECRET_NAME}" 2> /dev/null | jq .Name || true)
          if [ -z "$SECRET_EXISTS" ]; then
            aws secretsmanager create-secret --region "${REGION}" --name "${SECRET_NAME}" --secret-string "${SECRET_VALUE}"
          else
            aws secretsmanager update-secret --region "${REGION}" --secret-id "${SECRET_NAME}" --secret-string "${SECRET_VALUE}"
          fi

  close_issue:
    needs: [parse_issue, create_secret_dev, create_secret_qa, create_secret_prod]
    if: always() && needs.parse_issue.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Redact secret value, comment and close the issue
        uses: actions/github-script@v7
        with:
          script: |
            const results = [
              '${{ needs.create_secret_dev.result }}',
              '${{ needs.create_secret_qa.result }}',
              '${{ needs.create_secret_prod.result }}',
            ];
            const success = results.includes('success') && !results.includes('failure');
            const body = context.payload.issue.body.replace(
              /(### Secret Value\s*\n\s*\n).*/,
              '$1***REDACTED***'
            );
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
              state: 'closed',
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: success
                ? '✅ Secret criado/atualizado com sucesso.'
                : '❌ Falha ao processar a solicitação. Verifique os logs do workflow.',
            });
