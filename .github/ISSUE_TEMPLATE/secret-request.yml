name: 🔑 Secrets Generator
description: Cria ou atualiza um secret no AWS Secrets Manager
title: "[secrets-generator] "
labels:
  - secrets-generator
body:
  - type: markdown
    attributes:
      value: |
        Preencha os campos abaixo para criar ou atualizar um secret no AWS Secrets Manager.

        ⚠️ **Atenção**: o valor do secret ficará registrado no corpo desta issue até o workflow
        concluir a execução, quando então será automaticamente ofuscado. Evite deixar a issue
        aberta por muito tempo e não compartilhe o link publicamente.
  - type: dropdown
    id: env
    attributes:
      label: Environment
      description: Ambiente onde o secret será criado ou atualizado
      options:
        - dev
        - qa
        - prod
      default: 0
    validations:
      required: true
  - type: input
    id: secret_name
    attributes:
      label: Secret Name
      description: "Padrão: <prefixo>/<componente>/<secret-name>"
      placeholder: togglemaster-dev/app/secret-name
    validations:
      required: true
  - type: input
    id: secret_value
    attributes:
      label: Secret Value
      description: O valor do secret, ou seja, a senha, API key, etc.
    validations:
      required: true
